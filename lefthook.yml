pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,cjs,mjs,ts,jsx,tsx}'
      run: yarn eslint {staged_files}
    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn typecheck && yarn example typecheck
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: yarn commitlint --edit "{1}"
