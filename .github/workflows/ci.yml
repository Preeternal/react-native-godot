name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn prepare && yarn typecheck && yarn example typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  test-android-jvm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-jvm-tests-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jvm-tests-
            ${{ runner.os }}-gradle-

      - name: Run Android JVM unit tests
        working-directory: example/android
        run: |
          ./gradlew :preeternal_react-native-godot:testDebugUnitTest --no-daemon --console=plain

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  verify-packaged-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Verify packaged artifacts
        run: yarn check:packaged-artifacts

  expo-prebuild:
    runs-on: ubuntu-latest

    env:
      EXPO_WORK_DIR: ${{ github.workspace }}/.tmp/expo-prebuild

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Expo prebuild smoke test
        run: |
          set -euo pipefail

          rm -rf "$EXPO_WORK_DIR"
          mkdir -p "$EXPO_WORK_DIR"

          yarn prepare
          npm pack --silent --ignore-scripts \
            --pack-destination "$EXPO_WORK_DIR" \
            > "$EXPO_WORK_DIR/npm-pack.log"
          PACKAGE_TGZ="$(find "$EXPO_WORK_DIR" -maxdepth 1 -type f \
            -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_TGZ"

          npx --yes create-expo-app@latest "$EXPO_WORK_DIR/app" \
            --template blank-typescript --yes --no-install

          mkdir -p "$EXPO_WORK_DIR/app/assets"
          cp "$GITHUB_WORKSPACE/example/ios/GodotTest.pck" \
            "$EXPO_WORK_DIR/app/assets/GodotTest.pck"

          cd "$EXPO_WORK_DIR/app"
          npm install
          npm install "$PACKAGE_TGZ" 2>&1 \
            | tee "$EXPO_WORK_DIR/package-install.log"

          node "$GITHUB_WORKSPACE/scripts/ci/verify-prebuilt-install.cjs" \
            "$EXPO_WORK_DIR/app/node_modules/@preeternal/react-native-godot"

          node <<'NODE'
          const fs = require('node:fs');

          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo = app.expo || {};
          app.expo.plugins = [
            [
              '@preeternal/react-native-godot',
              { iosPacks: ['./assets/GodotTest.pck'] },
            ],
          ];
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

          CI=1 npx expo config --json \
            > "$EXPO_WORK_DIR/expo-config.json" \
            2> "$EXPO_WORK_DIR/expo-config.stderr.log"
          node -e \
            "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" \
            "$EXPO_WORK_DIR/expo-config.json"

          CI=1 npx expo prebuild --platform all --clean --no-install 2>&1 \
            | tee "$EXPO_WORK_DIR/prebuild.log"

          grep -Fx 'android.minSdkVersion=29' android/gradle.properties
          grep -Fx 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' \
            android/gradle.properties
          grep -F 'libgodot-android' android/gradle.properties
          grep -F 'react-native-godot-assets' android/app/build.gradle

          PBXPROJ="$(find ios -name '*.pbxproj' -print -quit)"
          test -n "$PBXPROJ"
          grep -F 'GodotTest.pck' "$PBXPROJ"

      - name: Print Expo prebuild diagnostics
        if: always()
        run: |
          set -euo pipefail

          echo '::group::package install log'
          if [[ -f "$EXPO_WORK_DIR/package-install.log" ]]; then
            cat "$EXPO_WORK_DIR/package-install.log"
          else
            echo "Missing: $EXPO_WORK_DIR/package-install.log"
          fi
          echo '::endgroup::'

          echo '::group::expo config'
          if [[ -f "$EXPO_WORK_DIR/expo-config.json" ]]; then
            cat "$EXPO_WORK_DIR/expo-config.json"
          else
            echo "Missing: $EXPO_WORK_DIR/expo-config.json"
          fi
          echo '::endgroup::'

          echo '::group::expo config stderr'
          if [[ -f "$EXPO_WORK_DIR/expo-config.stderr.log" ]]; then
            cat "$EXPO_WORK_DIR/expo-config.stderr.log"
          else
            echo "Missing: $EXPO_WORK_DIR/expo-config.stderr.log"
          fi
          echo '::endgroup::'

          echo '::group::prebuild log'
          if [[ -f "$EXPO_WORK_DIR/prebuild.log" ]]; then
            cat "$EXPO_WORK_DIR/prebuild.log"
          else
            echo "Missing: $EXPO_WORK_DIR/prebuild.log"
          fi
          echo '::endgroup::'

      - name: Upload Expo prebuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-prebuild-diagnostics
          if-no-files-found: warn
          path: |
            ${{ env.EXPO_WORK_DIR }}/package-install.log
            ${{ env.EXPO_WORK_DIR }}/app/app.json
            ${{ env.EXPO_WORK_DIR }}/expo-config.json
            ${{ env.EXPO_WORK_DIR }}/expo-config.stderr.log
            ${{ env.EXPO_WORK_DIR }}/prebuild.log
            ${{ env.EXPO_WORK_DIR }}/app/android/gradle.properties
            ${{ env.EXPO_WORK_DIR }}/app/android/app/build.gradle

      - name: Cleanup Expo prebuild workspace
        if: always()
        run: rm -rf "$EXPO_WORK_DIR"

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"


      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      - name: Verify 16KB page alignment
        run: bash scripts/check-16kb.sh

  build-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        run: |
          cd example
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          set -euo pipefail
          IOS_BUILD_LOG="$RUNNER_TEMP/ios-build.log"
          if ! yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" \
            2>&1 | tee "$IOS_BUILD_LOG"; then
            echo '::group::First iOS errors'
            grep -nE " error: |fatal error:|Command PhaseScriptExecution failed|No such file|cannot find type |Undefined symbols|ld: " \
              "$IOS_BUILD_LOG" | head -n 80 || true
            echo '::endgroup::'
            exit 1
          fi

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-log
          if-no-files-found: warn
          path: ${{ runner.temp }}/ios-build.log

  build-ios-spm:
    runs-on: macos-latest

    env:
      XCODE_VERSION: latest-stable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache React Native SwiftPM artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ReactNative/spm-artifacts
          key: ${{ runner.os }}-react-native-spm-${{ hashFiles('example/package.json', 'Package.swift', 'yarn.lock', '.yarn/patches/**') }}
          restore-keys: |
            ${{ runner.os }}-react-native-spm-

      - name: Prepare SPM-compatible example
        working-directory: example
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const dependency of [
            '@dr.pogodin/react-native-fs',
            'react-native-screens',
          ]) {
            delete packageJson.dependencies[dependency];
          }
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      - name: Enable SwiftPM integration
        working-directory: example
        run: |
          set -euo pipefail
          bundle install
          cd ios
          bundle exec npx react-native spm --deintegrate
          bundle exec npx react-native spm --yes

      - name: Build example for iOS with SwiftPM
        run: |
          set -euo pipefail
          IOS_BUILD_LOG="$RUNNER_TEMP/ios-spm-build.log"
          if ! xcodebuild \
            -project example/ios/RTNGodotViewExample.xcodeproj \
            -scheme RTNGodotViewExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath example/ios/build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$IOS_BUILD_LOG"; then
            echo '::group::First iOS SwiftPM errors'
            grep -nE " error: |fatal error:|Command PhaseScriptExecution failed|No such file|cannot find type |Undefined symbols|ld: " \
              "$IOS_BUILD_LOG" | head -n 80 || true
            echo '::endgroup::'
            exit 1
          fi

      - name: Verify podless SwiftPM integration
        run: |
          set -euo pipefail
          test ! -d example/ios/Pods
          test -f example/ios/RTNGodotViewExample.xcodeproj/.spm-injected.json
          grep -q 'XCLocalSwiftPackageReference' \
            example/ios/RTNGodotViewExample.xcodeproj/project.pbxproj

      - name: Upload SwiftPM build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-spm-build-log
          if-no-files-found: warn
          path: ${{ runner.temp }}/ios-spm-build.log
